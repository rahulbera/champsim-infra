# MongoDB v1 — QEMU/TCG full-system traces, captured 2026-09-05 on minitron
#
# First MongoDB capture. Driver is a purpose-written C program against libmongoc
# (workloads/mongodb/mongo_driver.c), NOT YCSB: a JVM client inside a TCG guest
# risks becoming the bottleneck and starving the traced server, and the point of
# the trace is the server's memory behaviour, not the client's.
#
# Configuration and why:
#   * 40M records x 1 KB against a 1 GB WiredTiger cache. The cache is
#     deliberately far smaller than the dataset so the working set does NOT sit
#     in cache -- the defect the 2026-09-04 audit found in the v1 corpus.
#   * theta=0.99 Zipfian. Unlike Redis (where theta=0.99 measured 7.7% branch /
#     70.8% mem and was REJECTED as LLC-resident), MongoDB at theta=0.99 measures
#     15.5-17.7% branch / 44.4-48.3% mem -- comfortably outside the reject band,
#     because WiredTiger's per-request work is far heavier than Redis's.
#   * rd95wr05 at the operation level.
#   * Single traced vCPU, server pinned to it (so eviction and checkpoint work
#     lands IN the trace rather than as invisible sibling work).
#   * 5 windows x 1e9 instructions, sample_clock=user, capture_pa=on, values=on.
#
# WINDOW SPREAD / MIX CHECK. The five windows read (user/kern/branch/mem):
#   w00000 51.7/48.3/15.5/48.3   w00001 54.8/45.2/16.0/48.2
#   w00003 55.4/44.6/16.0/48.2   w00002 56.7/43.3/16.8/46.6
#   w00004 56.1/43.9/17.7/44.4
# That is a smooth GRADIENT, not a bimodal split: branch rises and memory falls
# monotonically, w00004 sitting only 0.9 pt of branch and 2.2 pt of memory beyond
# w00002. Nothing like the memcached theta=0.6 regime split (86% kernel / 76% mem
# / 7% branch), so all five are kept.
#
# Honest note: w00003 converted to 999,985,056 instructions rather than exactly
# 1e9 -- 14,944 short, 0.0015%, the residue of idle-loop filtering.
#
# KNOWN LIMITATION, recorded 2026-09-06. The sample_gap was derived from the
# plugin's exit-time hint, which mixes units (it subtracts an all-instruction
# K*N from a user-only counter). The five windows are each internally valid --
# exact geometry, decode_fail 0 -- but they span less of the run than intended
# and cluster toward its beginning. See tracer/rpoint-cs/scripts/sgap.py for the
# derivation and the corrected formula. Recapture is optional and is a
# representativeness question, not a correctness one.
#
# Capture host: minitron. QEMU 9.2.4 + two patches (kvmclock, AVX hflag).
# Guest Ubuntu 24.04, MongoDB 8.0.29. Manifest and checksums preserved in
# docs/workloads/mongodb/. Built from the kratos2 catalogue's CHECKSUMS rows.

