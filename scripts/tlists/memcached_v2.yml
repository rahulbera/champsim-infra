# memcached v2 — QEMU/TCG full-system traces, captured 2026-09-04/05
#
# Recapture of the v1 memcached traces, which the 2026-09-04 audit found unusable:
# the loader (YCSB) and the query driver (memtier) used disjoint keyspaces, so every
# GET missed and the only live data was what the 5% SET stream created
# (unique_ppages = 15,958 against a nominal 8 GB store).
#
# v2 fixes and deliberate choices:
#   * ONE driver for both phases. memtier_benchmark preloads with --key-pattern=P:P
#     (mandatory for full 1..N coverage) and queries with the identical --key-prefix
#     and key range. Verified in the server's own counters, not in client output.
#   * --multi-key-get=16 with --pipeline=1, NOT --pipeline=16. ~94% of instructions
#     are per-REQUEST fixed cost; pipelining 16 commands still produces 16 responses
#     and pays it 16 times, while a multiget is one command and one response.
#     Gate 3.e (instructions per key lookup, hard stop 12,000) forced this.
#   * Single traced vCPU; memcached -t 1 pinned to it with `taskset -acp` (-a is
#     load-bearing: the request-serving thread is a separate pthread from the pid).
#   * 5 windows x 1e9 instructions, sample_clock=user, capture_pa=on, values=on.
#
# theta=0.6 yielded only ONE usable window. Windows 0-3 sampled an 86%-kernel /
# 76%-memory-op / 7%-branch bulk-copy regime that theta=0.8 never entered; they
# would have read as high-MPKI while being trivially prefetchable, and were
# discarded on 2026-09-05. w00004 matches the theta=0.8 profile and is kept.
#
# Capture host: rnadig. QEMU 9.2.4 + two patches (kvmclock, AVX hflag) — see
# tracer/rpoint-cs/patches/. Snapshot mc_v2_a. Plugin: periodic sampling, commit
# b5c3d29 on main.

