# TPC-H tracing configuration. Every value is a realistic analytics setting; the
# ONE deliberate deviation is parallel query, disabled so the trace is a genuine
# single-execution-thread slice (matches the 1t convention across this corpus).

# 2 GB on a 12 GB guest = the standard 25%-of-RAM rule. SF=10 data is ~10 GB, so
# the working set CANNOT fit -- which is the point.
shared_buffers = 2GB
effective_cache_size = 8GB

# 64 MB is a normal analytics setting. The stock 4 MB would push every TPC-H hash
# join and sort to spill to disk, turning a memory workload into an I/O one.
work_mem = 64MB
maintenance_work_mem = 1GB

# THE DEVIATION, recorded here and in the trace name: one execution process.
# 0 means the backend itself is the only executor. 1 would give leader + 1 worker.
max_parallel_workers_per_gather = 0
max_parallel_workers = 0
max_parallel_maintenance_workers = 0

random_page_cost = 1.1
checkpoint_timeout = 30min
max_wal_size = 8GB
